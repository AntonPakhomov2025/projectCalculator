<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="fon">
      <div class="window">
        <span id="history"></span>
        <span id="display"></span>
      </div>
      <div class="button">
        <button class="button__func" id="clean">C</button>
        <button class="button__func" id="plus_minus">+/-</button>
        <button class="button__func" id="percent">%</button>
        <button class="button__func__calculate" id="divide">/</button>
        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="button__func__calculate" id="multiply">*</button>
        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="button__func__calculate" id="subtract">-</button>
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="button__func__calculate" id="sum">+</button>
        <button class="number button__zero">0</button>
        <button class="number" id="point">.</button>
        <button id="equals">=</button>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
